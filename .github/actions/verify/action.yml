# 桌面端与前端的共享检查步骤集，test.yml 与 release.yml 都调用它。
#
# 抽成 composite action 的唯一理由是让"CI 会拒绝什么"与"发布前会检查什么"
# 永远一致：两处各写一份命令列表迟早会漂，漂的结果就是测试已经挂了、标签照样发版。
# 要增删检查项只改这里。
#
# 双平台：凭据加密两端都有真实实现（Windows DPAPI / Linux AES-256-GCM），
# 加解密与库迁移测试在两端都跑得到真实路径；Linux runner 需先装 webkit2gtk 等
# 系统包（tauri/gtk 的 pkg-config 依赖），见下方首个步骤。调用方 runner：
# Windows 用 windows-latest，Linux 固定 ubuntu-22.04——发布产物以 22.04 的 glibc
# 为兼容下限，24.04 上编译的二进制在 22.04 用户机器上跑不起来。
name: Verify desktop
description: cargo fmt / clippy -D warnings / test，加前端语法检查与逻辑回归

runs:
  using: composite
  steps:
    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

    - name: Setup Rust (stable)
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Rust cache
      uses: Swatinem/rust-cache@v2

    - name: cargo fmt --check
      shell: bash
      run: cargo fmt --all -- --check

    # -D warnings 是真门槛：clippy 基线已修干净（原 crypto.rs 的 chunks_exact_to_as_chunks
    # 已改为 as_chunks），新告警一律视为失败，不要用 -A 绕过。
    - name: cargo clippy -D warnings
      shell: bash
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: cargo test
      shell: bash
      run: cargo test --workspace

    - name: 前端语法检查
      shell: bash
      run: node --check dist/app.js

    - name: 前端逻辑回归（node:test）
      shell: bash
      run: node tests/frontend-navigation.test.js
