# Release 工作流：推送 v* 标签时在 Windows 上构建 MSI 并发布到 GitHub Release。
# workflow_dispatch 用于手动验证构建链路（不创建 Release，产物改为上传 artifact）。
#
# 说明：
# - 应用依赖 Windows DPAPI / windows-sys，仅 windows-latest 可构建，产物为 MSI。
# - 发布前先跑与 test.yml 同一份检查（.github/actions/verify），避免“测试已挂仍发版”。
# - 标签号必须与 src-tauri/tauri.conf.json 的 version 一致，否则直接失败：
#   MSI 文件名与 Release 标题会对不上。Cargo.toml 的 version 只用于 crate，不影响产物。
# - CHANGELOG.md 缺对应小节只告警不失败（回退为提交列表是既定行为）。
# - wix 配置了 zh-CN / en-US 两种语言，会各生成一个 MSI，glob 一并上传。
# - 自动更新要求 bundle.createUpdaterArtifacts = true（生成 .sig），且
#   latest.json 由本工作流手写：cargo tauri build 不产出清单（只有 tauri-action 会），
#   清单缺失或不匹配会让应用内更新静默失效，所以下面几道校验一律失败而非告警。
# - 构建产物位于工作区根 target/（Cargo workspace 根在仓库根目录）。
# - checkout 必须 fetch-depth: 0：回退逻辑要用 git describe 找上一个标签，浅克隆下取不到。
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 标签各自唯一，同组不取消：发布到一半被取消会留下半成品 Release。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows MSI
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # 升级 tauri-cli 时这里与下面的缓存键一起改；版本浮动会让缓存命中错误的二进制。
      TAURI_CLI_VERSION: '2.11.5'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run checks
        uses: ./.github/actions/verify

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $conf = Get-Content src-tauri/tauri.conf.json -Raw -Encoding utf8 | ConvertFrom-Json
          if ($conf.version -ne $version) {
            Write-Output "::error::标签 $tag 与 src-tauri/tauri.conf.json 的 version=$($conf.version) 不一致"
            exit 1
          }
          $pattern = "^## \[$([regex]::Escape($version))\]"
          if (-not (Select-String -Path CHANGELOG.md -Pattern $pattern -Quiet)) {
            Write-Output "::warning::CHANGELOG.md 缺少 [$version] 小节，Release Notes 将回退为提交列表"
          }

      - name: Cache tauri-cli binary
        id: tauri_cli_cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-${{ env.TAURI_CLI_VERSION }}-windows

      - name: Install Tauri CLI
        if: steps.tauri_cli_cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --locked --version "${{ env.TAURI_CLI_VERSION }}"

      - name: Build Tauri app
        shell: pwsh
        env:
          # updater 签名私钥（仓库 Settings → Secrets → Actions 配置，
          # 值取本地 .tauri/amax.key 文件内容；口令若设在另一个 secret 里）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 私钥带口令时必须一起给：CI 下缺省会按空口令解密，结果是“解密失败”而不是提示输入
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            if ("${{ startsWith(github.ref, 'refs/tags/') }}" -eq 'true') {
              Write-Output "::error::标签构建缺少 TAURI_SIGNING_PRIVATE_KEY：产物不会有 .sig，发布后所有客户端自动更新都会在下载后验签失败"
              exit 1
            }
            Write-Host "::warning::未配置 TAURI_SIGNING_PRIVATE_KEY，本次手动构建不生成更新签名"
          }
          cargo tauri build

      - name: List bundle output
        if: always()
        shell: pwsh
        run: Get-ChildItem -Recurse target\release\bundle -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Generate updater manifest
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $conf = Get-Content src-tauri/tauri.conf.json -Raw -Encoding utf8 | ConvertFrom-Json
          # 清单每个平台只能给一个包，双语 MSI 固定取 zh-CN 作为更新通道。
          # 先把产物名里的空格规范成点：tauri-bundler 用 productName 原样命名
          # （"AMAX Dashboard" 带空格），而 GitHub 建 Release 资产时会把空格换成点，
          # 于是本地叫 "AMAX Dashboard_*.msi" 的文件线上变成 "AMAX.Dashboard_*.msi"。
          # 不预先改名就只能猜平台侧的改写规则——v0.2.3 首发就猜错成 %20，清单 url 直接 404。
          # 改名后磁盘名、资产名、清单 url 三者恒等，Create Release 的 glob 也照常命中。
          Get-ChildItem "target/release/bundle/msi" -File | Where-Object { $_.Name -cmatch ' ' } | ForEach-Object {
            Rename-Item -LiteralPath $_.FullName -NewName ($_.Name -replace ' ', '.')
          }
          $msiFiles = @(Get-ChildItem "target/release/bundle/msi" -Filter '*_x64_zh-CN.msi' -File)
          if ($msiFiles.Count -ne 1) {
            Write-Output "::error::期望恰好 1 个 zh-CN MSI，实际 $($msiFiles.Count) 个：$($msiFiles.Name -join ', ')"
            exit 1
          }
          $msi = $msiFiles[0]
          $msiName = $msi.Name
          if ($msiName -cmatch ' ') { Write-Output "::error::资产名仍含空格（$msiName），清单 url 会与线上资产名不一致"; exit 1 }
          $sig = "$($msi.FullName).sig"
          if (-not (Test-Path $sig)) {
            Write-Output "::error::缺少 $msiName.sig：本次构建未签名（私钥缺失或无效），发布后客户端自动更新必然失败"
            exit 1
          }
          # pubkey 与 .sig 都是「base64(minisign 文本块)」，第 2 行的第 3~10 字节是密钥 id。
          # tauri build 遇到 id 不匹配只 log::warn，客户端侧表现为“下载后验签失败”，这里改成发版失败。
          function Get-Keyid([string]$encoded) {
            $block = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($encoded.Trim()))
            $bin = [Convert]::FromBase64String(($block -split '\r?\n')[1])
            [BitConverter]::ToString($bin[2..9])
          }
          try {
            $pubKeyId = Get-Keyid $conf.plugins.updater.pubkey
            $sigKeyId = Get-Keyid (Get-Content $sig -Raw)
          } catch {
            Write-Output "::error::tauri.conf.json 的 pubkey 或 $sig 不是合法的 minisign 文本块：$($_.Exception.Message)"
            exit 1
          }
          if ($pubKeyId -ne $sigKeyId) {
            Write-Output "::error::签名密钥 id ($sigKeyId) 与 pubkey 的 ($pubKeyId) 不一致：私钥与配置里的公钥不是同一对，请成对更新"
            exit 1
          }
          $manifest = [ordered]@{
            version  = $version
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$msiName"
                # .sig 内容已是签名文本块的 base64，清单原样引用
                signature = (Get-Content $sig -Raw).Trim()
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content target/release/bundle/latest.json -Encoding utf8NoBOM
          Get-Content target/release/bundle/latest.json

      - name: Upload MSI artifact (manual run only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: amax-msi-${{ github.run_id }}
          path: target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/')
        id: release_notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $body = ""
          if (Test-Path CHANGELOG.md) {
            $content = Get-Content CHANGELOG.md -Raw -Encoding utf8
            $pattern = "(?ms)^## \[$([regex]::Escape($version))\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)"
            $m = [regex]::Match($content, $pattern)
            if ($m.Success) { $body = $m.Groups[1].Value.Trim() }
          }
          if (-not $body) {
            # CHANGELOG.md 缺少对应小节时回退为上一标签以来的提交列表（需 fetch-depth: 0）
            $prev = git describe --tags --abbrev=0 "$tag^" 2>$null
            $range = if ($prev) { "$prev..$tag" } else { $tag }
            $commits = git log $range --pretty=format:"- %s"
            $body = "## 修改说明`n`n" + ($commits -join "`n")
          }
          "body<<NOTES_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "NOTES_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # msi 安装包 + updater 签名文件(.sig)与版本清单(latest.json，供应用内自动更新)
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.sig
            target/release/bundle/latest.json
          body: ${{ steps.release_notes.outputs.body }}
          draft: false
          prerelease: false

      # 发布完成后拿 GitHub 自己报的资产反查清单两处：
      # url 不在真实资产里 → 客户端对着 404 下载地址做更新（v0.2.3 首发正是这样"成功"的）；
      # signature 与线上那份 MSI 的 .sig 不一致 → 下载得到包但验签必失败（v0.2.3 手工修 url 时
      # 顺手用本地重建的清单覆盖过线上签名，本地 MSI 与 CI MSI 字节不同，签名也就不同）。
      # 这一步只看结论、不猜规则，任何一侧改名/改名清洗规则变化都会在这里暴露。
      - name: Verify updater manifest matches the published assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = "repos/$env:GITHUB_REPOSITORY/releases/tags/${{ github.ref_name }}"
          $assets = @(gh api $rel --jq '.assets[].browser_download_url')
          if ($LASTEXITCODE -ne 0 -or -not $assets) { Write-Output "::error::读取 Release 资产列表失败"; exit 1 }
          $plat = (Get-Content target/release/bundle/latest.json -Raw -Encoding utf8 | ConvertFrom-Json).platforms.'windows-x86_64'
          if ($assets -notcontains $plat.url) {
            Write-Output "::error::清单 url 指向的资产不存在，客户端更新会 404`n  清单: $($plat.url)`n  实际资产:`n$(($assets | ForEach-Object { "  - $_" }) -join "`n")"
            exit 1
          }
          $sigName = $plat.url.Split('/')[-1] + '.sig'
          $sigId = gh api $rel --jq ".assets[] | select(.name==`"$sigName`") | .id"
          if ($LASTEXITCODE -ne 0 -or -not $sigId) { Write-Output "::error::线上找不到 $sigName，无法校验清单签名"; exit 1 }
          $onlineSig = ((gh api "repos/$env:GITHUB_REPOSITORY/releases/assets/$sigId" -H 'Accept: application/octet-stream') -join '').Trim()
          if ($onlineSig -ne $plat.signature.Trim()) {
            Write-Output "::error::清单签名与线上 $sigName 不一致，客户端下载后验签必然失败`n  清单: $($plat.signature.Substring(0, 32))...`n  线上: $($onlineSig.Substring(0, 32))..."
            exit 1
          }
          Write-Output "清单 url 与签名均与线上资产一致：$($plat.url)"
