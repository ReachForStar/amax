[package]
name = "amax"
version = "0.2.5"
edition = "2024"

[lib]
name = "amax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["rustls-tls", "cookies", "json"] }
# tokio 特性裁剪：用 sync(Mutex)/time(sleep)/macros(join!)/rt(spawn_blocking 发邮件)；
# runtime 由 tauri::async_runtime 提供
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
# chrono 未用到 serde 序列化（时间串一律手动格式化）
chrono = "0.4"
rusqlite = { version = "0.34", features = ["bundled"] }
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
# lettre 只用同步 SMTP：rustls + ring 与 reqwest 共用同一份加密后端（不引入 aws-lc 第二 provider）；
# 根证书走系统信任库（rustls-native-certs）而非 webpki-roots，国内邮件服务商证书链常挂在
# Windows 自动更新的根集合里，用 Mozilla 内置集合会误判成不受信
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "hostname", "rustls", "ring", "rustls-native-certs"] }
# MeoW 端点把昵称与标题拼进路径段，须百分号编码（`/`、`#`、中文都会改写路由）；
# url 已在依赖树内（tauri 自身依赖），显式声明不增加体积
url = "2"
